<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Portfolio of a 4th-year BSIT student at National University – Dasmariñas. Aspiring Business Analyst, Project Manager, Front-End Developer, UI/UX Designer, and QA Tester. Seeking a 400-hour internship.">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Portfolio — BSIT Student · Aspiring Business Analyst">
  <meta property="og:description" content="Aspiring Business Analyst and Project Coordinator who also builds and tests the interfaces.">
  <meta property="og:image"       content="assets/logo.svg">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Portfolio — BSIT Student">
  <meta name="twitter:description" content="Aspiring Business Analyst and Project Coordinator who also builds and tests the interfaces.">

  <title>Portfolio — BSIT Student · Aspiring Business Analyst</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Google Fonts: Inter 400 & 600 only, display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet">

  <!--
    LOAD ORDER (critical — do not reorder):
    1. Bootstrap CSS  → provides modal/offcanvas/toast base styles
    2. Tailwind CDN   → preflight DISABLED to avoid Bootstrap conflicts
    3. style.css      → custom design system, overrides

    For production: replace Tailwind CDN script with purged CLI output.
    Run: npx tailwindcss -i ./css/tailwind-input.css -o ./css/tailwind.css --minify
    Then swap the <script> tag below for:
    <link rel="stylesheet" href="css/tailwind.css">
  -->

  <!-- 1. Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">

  <!-- 2. Tailwind CSS Play CDN (preflight disabled via config) -->
  <script>
    // Disable Tailwind's preflight so it doesn't clobber Bootstrap base styles.
    // Tailwind is used for utility classes in HTML only (layout, spacing, color,
    // typography). Bootstrap utilities are intentionally NOT used.
    window.tailwind = {
      config: {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              accent: {
                DEFAULT: '#2dd4bf',
                dark:    '#0f766e',
              },
            },
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 3. Custom design system -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Skip navigation (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ARIA live region for Role Lens announcements -->
  <div id="lens-announce" aria-live="polite" aria-atomic="true"></div>

  <!-- Dot-grid background canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Cursor spotlight overlay -->
  <div id="spotlight" aria-hidden="true"></div>

  <!-- =====================================================================
       PAGE WRAPPER — two-column grid on ≥1024px
       ===================================================================== -->
  <div id="page-wrapper">

    <!-- =================================================================
         MOBILE: sticky top bar
         ================================================================= -->
    <header id="top-bar">
      <!-- Populated by main.js → renderTopBar() -->
    </header>

    <!-- =================================================================
         MOBILE: sticky Role Lens chip strip (below top bar)
         ================================================================= -->
    <div
      id="role-lens-mobile"
      role="group"
      aria-label="View as role"
      aria-live="polite"
    >
      <!-- Populated by main.js → renderMobileLens() -->
    </div>

    <!-- =================================================================
         DESKTOP: fixed left sidebar
         ================================================================= -->
    <aside id="sidebar" aria-label="Site navigation and profile">
      <!-- Populated by main.js → renderSidebar() -->
    </aside>

    <!-- =================================================================
         RIGHT: scrollable main content
         ================================================================= -->
    <main id="main-content" tabindex="-1">

      <!-- -----------------------------------------------------------
           ABOUT
           ----------------------------------------------------------- -->
      <section id="about" class="section" aria-labelledby="about-heading">
        <h2 id="about-heading" class="section-heading">About</h2>
        <div id="about-content">
          <!-- Populated by main.js → renderAbout() -->
        </div>
      </section>

      <!-- -----------------------------------------------------------
           PROJECTS
           ----------------------------------------------------------- -->
      <section id="projects" class="section" aria-labelledby="projects-heading">
        <h2 id="projects-heading" class="section-heading">Projects</h2>
        <div id="projects-grid" class="projects-grid">
          <!-- Populated by main.js → renderProjects() -->
        </div>
      </section>

      <!-- -----------------------------------------------------------
           SKILLS
           ----------------------------------------------------------- -->
      <section id="skills" class="section" aria-labelledby="skills-heading">
        <h2 id="skills-heading" class="section-heading">Skills</h2>
        <div
          id="skills-filter-row"
          class="skills-filter-row"
          role="group"
          aria-label="Filter skills by category"
        >
          <!-- Populated by main.js → renderSkillFilters() -->
        </div>
        <div id="skills-groups" class="skills-groups" aria-live="polite">
          <!-- Populated by main.js → renderSkillGroups() -->
        </div>
      </section>

      <!-- -----------------------------------------------------------
           TIMELINE
           ----------------------------------------------------------- -->
      <section id="timeline" class="section" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading" class="section-heading">Timeline</h2>
        <ol id="timeline-list" class="timeline-list" aria-label="Education and career timeline">
          <!-- Populated by main.js → renderTimeline() -->
        </ol>
      </section>

      <!-- -----------------------------------------------------------
           CERTIFICATIONS
           ----------------------------------------------------------- -->
      <section id="certifications" class="section" aria-labelledby="certs-heading">
        <h2 id="certs-heading" class="section-heading">Certifications</h2>
        <div id="cert-list" class="cert-list">
          <!-- Populated by main.js → renderCertifications() -->
        </div>
      </section>

      <!-- -----------------------------------------------------------
           CONTACT
           ----------------------------------------------------------- -->
      <section id="contact" class="section" aria-labelledby="contact-heading">
        <h2 id="contact-heading" class="section-heading">Contact</h2>
        <p class="text-muted" style="font-size:.9375rem; margin-bottom:1.5rem; max-width:56ch;">
          Open to internship and OJT opportunities. Feel free to reach out.
        </p>
        <div id="contact-layout" class="contact-layout">
          <!-- Populated by main.js → renderContact() -->
        </div>
      </section>

      <!-- Bottom padding so last section clears viewport -->
      <div style="height: 4rem;" aria-hidden="true"></div>

    </main><!-- /#main-content -->

  </div><!-- /#page-wrapper -->

  <!-- =======================================================================
       MOBILE OFFCANVAS MENU (Bootstrap)
       ======================================================================= -->
  <div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="mobile-menu"
    aria-labelledby="mobile-menu-label"
  >
    <div class="offcanvas-header">
      <span id="mobile-menu-label" class="sr-only">Navigation menu</span>
      <!-- Populated by main.js → renderMobileMenu() -->
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <!-- Populated by main.js → renderMobileMenu() -->
    </div>
  </div>

  <!-- =======================================================================
       PROJECT CASE STUDY MODAL (Bootstrap)
       ======================================================================= -->
  <div
    class="modal fade"
    id="project-modal"
    tabindex="-1"
    aria-labelledby="project-modal-label"
    aria-modal="true"
    role="dialog"
  >
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="project-modal-label">Project</h3>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close case study"
          ></button>
        </div>
        <div class="modal-body" id="project-modal-body">
          <!-- Populated by main.js → openProjectModal() -->
        </div>
        <div class="modal-footer" id="project-modal-footer">
          <!-- Populated by main.js → openProjectModal() -->
        </div>
      </div>
    </div>
  </div>

  <!-- =======================================================================
       TOAST CONTAINER (Bootstrap)
       ======================================================================= -->
  <div
    id="toast-container"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- =======================================================================
       SCRIPTS
       Load Bootstrap JS bundle last (after DOM, before main.js module)
       ======================================================================= -->

  <!-- Bootstrap 5 JS bundle (includes Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmsSINzMX8UKZG0bAfnhT6LoRXZb"
    crossorigin="anonymous"
  ></script>

  <!-- Portfolio application (ES module — uses import/export) -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
