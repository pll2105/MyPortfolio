<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Portfolio of a 4th-year BSIT student at National University – Dasmariñas.
    Aspiring Business Analyst, Project Manager, Front-End Developer, UI/UX Designer, and QA Tester.">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc"  media="(prefers-color-scheme: light)">

  <title>Portfolio — BSIT Student · Aspiring Business Analyst</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- ─── Fonts ─────────────────────────────────────────────────────────── -->
  <!-- Momo Trust Display (titles/nav) + Inter 400/600 (body/subtext) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

  <!-- ─── Bootstrap CSS (JS components only — modal, offcanvas, toast) ──── -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">

  <!-- ─── Page stylesheets (order matters) ─────────────────────────────── -->
  <link rel="stylesheet" href="css/tokens.css">   <!-- design tokens   -->
  <link rel="stylesheet" href="css/base.css">     <!-- reset + utils   -->
  <link rel="stylesheet" href="css/glass.css">    <!-- glass system    -->
  <link rel="stylesheet" href="css/hero.css">     <!-- hero page only  -->
</head>

<body>

  <!-- Skip to content (a11y) -->
  <a href="#hero-text" class="skip-link">Skip to main content</a>

  <!-- ─── Dot-grid background (canvas, populated by hero.js) ──────────── -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- ═══════════════════════════════════════════════════════════════════
       TOP NAV
       ═══════════════════════════════════════════════════════════════════ -->
  <nav id="top-nav" class="top-nav" aria-label="Site navigation">
    <!-- Populated by hero.js → renderNav() -->
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════════
       FIXED SOCIAL RAIL — left side (desktop only)
       ═══════════════════════════════════════════════════════════════════ -->
  <aside id="social-rail" class="social-rail social-rail--left" aria-label="Social links">
    <!-- Populated by hero.js → renderSocialRail() -->
  </aside>

  <!-- ═══════════════════════════════════════════════════════════════════
       FIXED EMAIL RAIL — right side (desktop only)
       ═══════════════════════════════════════════════════════════════════ -->
  <aside class="social-rail social-rail--right" aria-label="Email contact">
    <a href="mailto:your@email.com" id="rail-email"
       class="rail-email"
       aria-label="Send email">
      your@email.com
    </a>
  </aside>

  <!-- ═══════════════════════════════════════════════════════════════════
       HERO SECTION
       ═══════════════════════════════════════════════════════════════════ -->
  <main>
    <section id="hero" class="hero" aria-label="Introduction">

      <!-- LEFT — text content -->
      <div id="hero-text" class="hero-text" tabindex="-1">

        <!-- "Hi! ✌️" -->
        <p class="hero-greeting" aria-label="Hi!">
          Hi! <span class="wave" aria-hidden="true">✌️</span>
        </p>

        <!-- "my name is YOUR FULL NAME" -->
        <p class="hero-name-line" id="hero-name">
          <!-- Populated by hero.js → renderHero() -->
          my name is <strong>YOUR FULL NAME</strong>
        </p>

        <!-- Tagline -->
        <p class="hero-tagline" id="hero-tagline">
          <!-- Populated by hero.js -->
          I turn ideas into experiences.
        </p>

        <!-- Bio paragraph -->
        <p class="hero-bio" id="hero-bio">
          <!-- Populated by hero.js -->
        </p>

        <!-- CTA -->
        <a href="#contact" id="hero-cta" class="p-btn p-btn-ghost">
          Get in touch
        </a>

      </div><!-- /.hero-text -->

      <!-- RIGHT — photo -->
      <div class="hero-photo" role="img" aria-label="Profile photo">

        <!-- Placeholder shown until photo loads or if missing -->
        <div id="hero-photo-placeholder" class="hero-photo-placeholder">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.25" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>
            Drop your photo at<br>
            <code style="font-size:.75rem; color:var(--accent);">assets/photo.jpg</code>
          </span>
        </div>

        <!--
          YOUR PHOTO — place your image file at assets/photo.jpg (or .png, .webp).
          Update the src attribute below to match your filename.
          Recommended: portrait orientation, min 800px wide, transparent or matching bg.
        -->
        <img
          id="hero-img"
          class="hero-photo-img"
          src="assets/photo.jpg"
          alt="Profile photo of YOUR FULL NAME"
          loading="eager"
          decoding="async"
          width="800"
          height="1000">

      </div><!-- /.hero-photo -->

      <!-- Scroll hint -->
      <div class="scroll-hint" aria-hidden="true">
        <span>scroll</span>
        <div class="scroll-hint-line"></div>
      </div>

    </section>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════
       MOBILE OFFCANVAS DRAWER (Bootstrap)
       ═══════════════════════════════════════════════════════════════════ -->
  <div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="mobile-drawer"
    aria-labelledby="mobile-drawer-label"
  >
    <div class="offcanvas-header">
      <span id="mobile-drawer-label" class="sr-only">Navigation menu</span>
      <!-- Populated by hero.js → renderDrawer() -->
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <!-- Populated by hero.js → renderDrawer() -->
    </div>
  </div>

  <!-- ─── Bootstrap JS bundle ───────────────────────────────────────── -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmsSINzMX8UKZG0bAfnhT6LoRXZb"
    crossorigin="anonymous"></script>

  <!-- ─── Hero application (ES module) ─────────────────────────────── -->
  <script type="module" src="js/hero.js"></script>

</body>
</html>
